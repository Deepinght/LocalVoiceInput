[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceinput"
version = "0.2.1"
description = "Offline Windows voice input with review and opt-in direct output"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "sherpa-onnx>=1.12,<2", "sounddevice>=0.5,<1", "numpy>=2,<3", "PyYAML>=6,<7", "lupa>=2.4,<3", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
voiceinput = "voiceinput.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
